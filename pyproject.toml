[tool.poetry]
name = "grepy"
version = "0.2.0"
description = "A Grep clone"
authors = ["Eliaz Bobadilla <eliaz.bobadilladev@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/UltiRequiem/grep"
repository = "https://github.com/UltiRequiem/grep"
keywords = ["commands", "utilities", "cli","grep"]
include = ["LICENSE"]

[tool.poetry.dependencies]
python = ">=3.9"

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
pylint = "*"

[tool.poetry.scripts]
grepy = 'grepy:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
